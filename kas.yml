header:
  version: 19

machine: raspberrypi3
distro: poky

target:
  - core-image-base

repos:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: master
    layers:
      .:

  bitbake:
    url: https://git.openembedded.org/bitbake
    path: layers/bitbake
    branch: master
    layers:
      bitbake: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: layers/openembedded-core
    branch: master
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: layers/meta-yocto
    branch: master
    layers:
      meta-poky:
      meta-yocto-bsp:

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  # raspberrypi3's onboard Broadcom Wi-Fi firmware is under a restricted
  # license; accept it explicitly or drop Wi-Fi support for this machine.
  license: |
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
  # ftpmirror.gnu.org/savannah.gnu.org (shared GNU infra IP) silently hangs
  # connections instead of failing fast, stalling do_fetch for many minutes
  # before bitbake's normal MIRRORS fallback kicks in. Try the reliable
  # Yocto Project mirror first instead.
  premirrors: |
    PREMIRRORS:prepend = " \
        git://.*/.* http://downloads.yoctoproject.org/mirror/sources/ \n \
        ftp://.*/.* http://downloads.yoctoproject.org/mirror/sources/ \n \
        http://.*/.* http://downloads.yoctoproject.org/mirror/sources/ \n \
        https://.*/.* http://downloads.yoctoproject.org/mirror/sources/ \n"
  # ftpmirror.gnu.org silently drops requests when hit with too many
  # concurrent connections from one IP (verified: fine one-at-a-time, hangs
  # with 3+ simultaneous fetches). Cap parallelism so bitbake doesn't burst
  # several do_fetch tasks at that host at once.
  parallelism: |
    BB_NUMBER_THREADS = "3"
    PARALLEL_MAKE = "-j 3"
  # Uncomment/extend to enable board features, e.g.:
  # rpi-specific: |
  #   ENABLE_I2C = "1"
  #   RPI_EXTRA_CONFIG = "dtoverlay=disable-bt"
